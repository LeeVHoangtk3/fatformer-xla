experiment:
  name: phase7_improvement_round1_p1_clip_full
  branch: M4
  seed: 42
  description: Phase 7 Anchored Recovery v2 Ablation Study
model:
  backbone: CLIP:ViT-L/14
  clip_path: DATASET/pretrained/ViT-L-14.pt
  checkpoint_init: DATASET/pretrained/fatformer_4class_ckpt.pth
  teacher_checkpoint: DATASET/pretrained/fatformer_4class_ckpt.pth
  num_classes: 2
  use_srm: true
  use_gating: true
  srm_out_dim: 1024
loss:
  mode: v2
  type: CrossDomainTotalLoss
  label_smoothing: 0.05
  temperature: 2.0
  weight_ce: 0.3
  weight_ce_deg: 0.3
  alpha_kd: 0.7
  beta_cons: 0.2
  weight_feat: 0.3
  weight_guard: 0.5
  fake_index: 1
training:
  device: cuda
  epochs: 5
  batch_size: 16
  learning_rate: 0.0001
  anchor_learning_rate: 1.0e-05
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_accum_steps: 2
  grad_clip_norm: 1.0
  use_amp: true
  save_dir: DATASET/checkpoints/phase7/improvement_round1/RUN_ID/p1_clip_full
  save_name: fatformer_anchored_v2_best.pth
  real_guard_threshold: 0.9
  calibration_file: DATASET/logs/phase7/calibration/baseline.json
  q30_max_samples: 300
  preflight_min_free_gib: 0.0
dataset:
  manifest: DATASET/manifests/data_manifest_v2.json
  isolation_report: DATASET/logs/phase7/data_isolation_report.json
  audit_config: configs/phase7_data_v2.runtime.yaml
  train_dir: ''
  val_dir: ''
  val_split: val_select
  degradation_config: configs/degradation_v2.yaml
  num_workers: 2
  preprocessing: clip
  validation_preprocessing: clip
