# ==============================================================================
# FATFORMAT-XLA: CAU HINH HUAN LUYEN NHANH M5 — DATA + DISTILL + CONSISTENCY + LORA
# Task 6.3-C & Task 6.5 — Thanh vien C (Training & Evaluation Lead)
# ==============================================================================
# Dac trung: Ke thua toan bo M4, dong thoi bo sung LoRA Adapter (r=8, alpha=16)
#            tren 2 khoi Transformer cuoi cua backbone ViT-L/14 nham mo rong tham so
#            thich ung co kiem soat ma khong pha vo dac trung dong bang.
# ==============================================================================

experiment:
  name: "M5_data_distill_lora"
  branch: "M5"
  seed: 42
  description: "Finetuning da mien voi Loss tich hop va LoRA ViT Adapter"

model:
  backbone: "CLIP:ViT-L/14"
  clip_path: "ViT-L-14.pt"
  checkpoint_init: "DATASET/checkpoints/fatformer_plan_a_best_weights.pth"
  teacher_checkpoint: "fatformer_4class_ckpt.pth"
  num_classes: 2
  use_srm: true
  use_gating: true
  srm_out_dim: 1024

loss:
  type: "CrossDomainTotalLoss"
  label_smoothing: 0.05
  temperature: 2.0
  alpha_kd: 0.4
  beta_cons: 0.2

lora:
  enabled: true
  rank: 8
  alpha: 16.0
  num_layers: 2

training:
  epochs: 5
  batch_size: 64
  learning_rate: 1.0e-5
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  use_amp: true
  save_dir: "DATASET/checkpoints/m5"
