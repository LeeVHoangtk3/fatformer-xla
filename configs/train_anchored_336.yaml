experiment:
  name: anchored_336_run1
  branch: M4
  seed: 42
  description: 336 input, paired clean/degraded, runtime positional interpolation
model:
  backbone: CLIP:ViT-L/14
  clip_path: DATASET/pretrained/ViT-L-14.pt
  checkpoint_init: DATASET/pretrained/fatformer_4class_ckpt.pth
  teacher_checkpoint: DATASET/pretrained/fatformer_4class_ckpt.pth
  num_classes: 2
  use_srm: true
  use_gating: true
  srm_out_dim: 1024
loss:
  type: CrossDomainTotalLoss
  label_smoothing: 0.05
  temperature: 2.0
  weight_ce: 0.3
  weight_ce_deg: 0.3
  alpha_kd: 0.7
  beta_cons: 0.2
  weight_feat: 0.3
  weight_guard: 0.5
  fake_index: 1
training:
  device: cuda
  epochs: 5
  batch_size: 4
  learning_rate: 0.0001
  anchor_learning_rate: 1.0e-05
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_accum_steps: 8
  grad_clip_norm: 1.0
  use_amp: true
  save_dir: DATASET/checkpoints/resolution336
  save_name: best.pth
  real_guard_threshold: 0.9
  calibration_file: DATASET/logs/resolution336/selection/baseline336.json
  q30_max_samples: 300
  preflight_min_free_gib: 10.0
dataset:
  manifest: DATASET/manifests/data_manifest_v2.json
  isolation_report: DATASET/logs/phase7/data_isolation_report.json
  audit_config: configs/phase7_data_v2.runtime.yaml
  train_dir: ''
  val_dir: ''
  val_split: val_select
  degradation_config: configs/degradation_336.yaml
  num_workers: 2
  img_resolution: 336
  crop_resolution: 336
  preprocessing: legacy_imagenet
  validation_preprocessing: legacy_imagenet
