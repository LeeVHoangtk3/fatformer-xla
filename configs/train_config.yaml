# ==============================================================================
# FATFORMER-XLA: FILE CẤU HÌNH HUẤN LUYỆN CHUẨN HÓA
# Task 3.4 — Thành viên B (Architecture & Loss Lead)
# ==============================================================================
# Mục đích: Định nghĩa toàn bộ siêu tham số cho 3 giai đoạn Curriculum
#           Training của FatFormer-XLA. File này là nguồn sự thật duy nhất
#           (single source of truth) cho mọi thực nghiệm huấn luyện.
#
# Kế thừa từ Milestone 1 (milestone_1_freeze.md, 2026-09-30):
#   - Baseline Clean ACC = 96.45% (mốc trần cần bảo toàn ±0.50%)
#   - Mục tiêu Q=30 ACC ≥ 63% ~ 68% (từ 52.89%)
#   - Fake ACC Q=30 ≥ 50.00% (từ 5.78%)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CẤU HÌNH MÔ HÌNH (Model Configuration)
# ------------------------------------------------------------------------------
model:
  backbone: "ViT-L-14.pt"              # File TorchScript JIT — nạp bằng torch.jit.load()
  checkpoint: "fatformer_4class_ckpt.pth"  # Checkpoint gốc CVPR 2024 (1,116 tensors)
  num_classes: 2                       # Binary classification: real (0) vs fake (1)
  num_context_embedding: 8             # Số soft prompt tokens (CoCoOp style)

  # Cờ bật/tắt các module mới của FatFormer-XLA
  use_srm: true                        # Bật Spatial Residual Block (SRM 3-Kernels)
  use_gating: true                     # Bật Dynamic Frequency Gating λ(x) ∈ [0, 2]
  srm_out_dim: 1024                    # Chiều chiếu đặc trưng SRM → token space ViT-L

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH ĐÓNG BĂNG THAM SỐ (Parameter Freeze — Task 3.4)
# ------------------------------------------------------------------------------
freeze:
  # Danh sách module prefix sẽ được MỞ KHÓA (trainable)
  # Tất cả phần còn lại của CLIP ViT-L/14 sẽ bị đóng băng
  trainable_modules:
    - "language_guided_alignment"      # LGA: patch_basaed_enhancer + norm + FFN
    - "text_guided_interactor"         # Text-guided interactor
    - "norm1"
    - "norm2"
    - "linear1"
    - "linear2"
    - "activation"
    - "srm"                            # SRM projection layer (kernel cố định, proj học được)
    - "gating"                         # Dynamic Gating MLP
  trainable_params:
    - "language_guided_alignment.ctx"  # Soft prompt vector
  # Mục tiêu: trainable ratio ∈ [5.5%, 6.0%] (~55M / ~933M tham số)
  target_trainable_ratio_min: 0.055
  target_trainable_ratio_max: 0.060

# ------------------------------------------------------------------------------
# 3. CẤU HÌNH HÀM MẤT MÁT (Loss Configuration — Task Finetune Phương Án A)
# ------------------------------------------------------------------------------
loss:
  type: "DualStreamCELoss"             # Dual-Stream Cross-Entropy với Label Smoothing
  label_smoothing: 0.1                 # Chống over-fitting trên tập Staging và ổn định logits
  # Dành cho thực nghiệm so sánh Ablation:
  # type: "DualStreamFocalLoss", alpha: 0.25, gamma: 1.0

# ------------------------------------------------------------------------------
# 4. CẤU HÌNH HUẤN LUYỆN TỔNG QUÁT (General Training Configuration)
# ------------------------------------------------------------------------------
training:
  total_epochs: 5
  batch_size: 32                       # Trên GPU A100 SXM4 40GB hoặc RTX 6000
  grad_accumulation_steps: 2           # Effective batch size = 32 × 2 = 64
  amp_fp16: true                       # Automatic Mixed Precision FP16
  # Peak VRAM nghiệm thu (Task 1.3): 9.05 GB trên T4; ~18-22 GB trên A100

  optimizer:
    name: "AdamW"
    # Học tốc khác nhau cho từng nhóm module thích ứng
    lr_adapter: 1.0e-4                 # FAA adapters và LGA modules
    lr_gating: 1.0e-3                  # Dynamic Gating λ(x) — học nhanh hơn
    lr_prompt: 1.0e-3                  # Soft prompt vector ctx
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "CosineAnnealingLR"
    T_max: 5                           # Cosine period = tổng số epoch
    eta_min: 1.0e-6                    # Learning rate tối thiểu

  gradient_clipping:
    enabled: true
    max_norm: 1.0                      # Clip gradient norm ≤ 1.0 (chống gradient explosion)

# ------------------------------------------------------------------------------
# 5. GIÁO TRÌNH SUY BIẾN 3 GIAI ĐOẠN (Curriculum Degradation Schedule)
# Đã khóa cứng clean_ratio = 0.50 xuyên suốt các giai đoạn chống Catastrophic Forgetting
# ------------------------------------------------------------------------------
curriculum:
  # Giai đoạn 1: Làm quen nhẹ nhàng — Suy biến mức thấp (Epoch 1-2)
  phase1:
    epochs: [1, 2]
    jpeg_quality_range: [70, 90]       # Nén nhẹ JPEG Q ∈ [70, 90]
    blur_sigma_range: [0.5, 1.0]       # Gaussian Blur σ ∈ [0.5, 1.0]
    downsample: false                  # Chưa dùng Down-Up ở giai đoạn này
    clean_ratio: 0.5                   # 50% mẫu không suy biến (bảo toàn kiến thức sạch)

  # Giai đoạn 2: Tăng áp lực trung bình — Suy biến vừa phải (Epoch 3-4)
  phase2:
    epochs: [3, 4]
    jpeg_quality_range: [45, 70]       # Nén trung bình Q ∈ [45, 70]
    blur_sigma_range: [1.0, 1.5]
    downsample: true
    downsample_target_size: 160        # Down-Up 224 → 160 → 224
    clean_ratio: 0.5                   # KHÓA CỨNG: 50% mẫu sạch

  # Giai đoạn 3: Hardening cực hạn — Suy biến sâu (Epoch 5)
  phase3:
    epochs: [5, 5]
    jpeg_quality_range: [30, 50]       # Nén sâu Q ∈ [30, 50] — tử huyệt Q=30
    blur_sigma_range: [1.5, 2.0]
    downsample: true
    downsample_target_size: 112        # Down-Up 224 → 112 → 224
    clean_ratio: 0.5                   # KHÓA CỨNG: 50% mẫu sạch
    lr_multiplier: 0.5                 # Giảm học tốc thêm 50% cho ổn định

# ------------------------------------------------------------------------------
# 6. CẤU HÌNH DỮ LIỆU ĐA MIỀN (Multi-Domain Data Configuration - Phương Án A)
# Thư mục Drive 5TB: /content/drive/MyDrive/Fatformer/ (Task 1.1)
# ------------------------------------------------------------------------------
data:
  # Đường dẫn file nén trên Drive 5TB
  progan_tar: "/content/drive/MyDrive/Fatformer/datasets/progan_train.tar"      # 144.024 ảnh
  staging_tar: "/content/drive/MyDrive/Fatformer/datasets/diffusion_staging.tar" # 3.600 ảnh
  val_tar: "/content/drive/MyDrive/Fatformer/datasets/progan_val.tar"           # 8.000 ảnh

  # Đường dẫn SSD Colab sau khi giải nén
  train_data_dir: "/content/dataset_local/progan_train/"
  staging_data_dir: "/content/dataset_local/diffusion_staging/"
  val_data_dir: "/content/dataset_local/progan_val/"

  image_size: 224                      # Kích thước đầu vào ViT-L/14
  num_workers: 4
  pin_memory: true

  # Tỉ lệ phân bổ lấy mẫu trong mỗi batch (WeightedRandomSampler)
  progan_ratio: 0.85                   # 85% ProGAN (~54 ảnh / batch 64)
  staging_ratio: 0.15                  # 15% Diffusion Staging (~10 ảnh / batch 64)

# ------------------------------------------------------------------------------
# 7. CẤU HÌNH CHECKPOINT & LOGGING
# (Cơ chế auto-save — Task 3.5 - Lead C)
# ------------------------------------------------------------------------------
checkpoint:
  save_dir: "/content/drive/MyDrive/Fatformer/checkpoints/"  # Drive 5TB an toàn
  save_every_epoch: true               # Lưu sau mỗi epoch (ngăn mất dữ liệu khi Colab ngắt)
  keep_last_n: 3                       # Giữ 3 checkpoint gần nhất để tiết kiệm dung lượng
  resume_from: null                    # Đặt đường dẫn checkpoint khi resume (null = train mới)
  # Tên file checkpoint cuối:
  #   fatformer_srm_phase2.pth  (sau Epoch 5)
  #   fatformer_srm_robust_final.pth (sau Epoch 8 — mô hình chính nộp)

logging:
  log_every_n_steps: 10               # In log mỗi 10 bước
  fast_eval_every_epoch: true         # Chạy fast_eval.py sau mỗi epoch (< 8 phút)
  wandb: false                         # Không dùng WandB (môi trường Colab giới hạn)
